<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Aplicativo de acompanhamento médico offline-first para pacientes e médicos." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MedCare" />

  <link rel="manifest" href="./manifest.json" />

  <title>MedCare — Acompanhamento</title>

  <!-- Tailwind via CDN, conforme solicitado. O Service Worker cacheia este recurso depois do primeiro acesso online. -->

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#effcf8', 100: '#d9f7ef', 200: '#b8eee0', 300: '#83ddca',
              400: '#4ec6b0', 500: '#20aa92', 600: '#118a78', 700: '#0f766e',
              800: '#115f5a', 900: '#124e4b'
            }
          }
        }
      }
    };
  </script>

  <style>
    /* ============================================================
       PERSONALIZAÇÃO RÁPIDA — altere só estas variáveis.
       ============================================================ */
    :root {
      --brand: #0f766e;
      --brand-dark: #115e59;
      --brand-soft: #effcf8;
      --ink: #12201f;
      --muted: #657572;
      --surface: #ffffff;
      --surface-2: #f5f8f7;
      --line: #dfe8e5;
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(32,170,146,.08), transparent 28%),
        linear-gradient(180deg, #fbfefd 0%, #f5f8f7 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app-shell { min-height: 100vh; }
    .glass {
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .card {
      background: var(--surface);
      border: 1px solid rgba(223,232,229,.9);
      border-radius: var(--radius);
      box-shadow: 0 18px 50px rgba(18, 32, 31, .06);
    }
    .field {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 12px 14px;
      color: var(--ink);
      background: #fff;
      outline: none;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    .field:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(15,118,110,.10);
    }
    .field::placeholder { color: #95a6a2; }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 18px;
      border: 1px solid transparent;
      border-radius: 15px;
      color: #fff;
      background: var(--brand);
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, background .2s;
      box-shadow: 0 10px 20px rgba(15,118,110,.18);
    }
    .btn-primary:hover { background: var(--brand-dark); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s;
    }
    .btn-secondary:hover { background: #f9fbfb; border-color: #cbd8d5; transform: translateY(-1px); }
    .btn-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 11px 16px;
      border: 1px solid #fecaca;
      border-radius: 14px;
      color: #991b1b;
      background: #fff7f7;
      font-weight: 700;
      cursor: pointer;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .badge-green { background: #ecfdf3; color: #166534; }
    .badge-amber { background: #fff7ed; color: #9a3412; }
    .badge-slate { background: #f1f5f4; color: #465653; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 11px 13px;
      border-radius: 14px;
      color: #61706d;
      font-weight: 700;
      transition: .2s;
      cursor: pointer;
      background: transparent;
      border: 0;
      text-align: left;
    }
    .nav-item:hover { background: #f1f7f5; color: var(--ink); }
    .nav-item.active { background: var(--brand-soft); color: var(--brand); }

    .bottom-nav {
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }

    .toast-wrap {
      position: fixed;
      z-index: 1000;
      right: 16px;
      left: 16px;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .toast {
      width: min(100%, 440px);
      padding: 13px 15px;
      border-radius: 16px;
      color: white;
      box-shadow: 0 20px 50px rgba(0,0,0,.16);
      animation: toastIn .24s ease-out;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .fade-in { animation: fadeIn .25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: #eef3f1;
    }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 100% { transform: translateX(100%); } }

    .timeline-line { position: relative; }
    .timeline-line::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 5px;
      bottom: 5px;
      width: 2px;
      background: #dbe8e4;
    }
    .timeline-dot {
      position: relative;
      z-index: 1;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--brand-soft);
      border: 7px solid #fff;
      box-shadow: 0 0 0 1px #cfe4df;
      flex: 0 0 auto;
    }

    @media (min-width: 900px) {
      .mobile-only { display: none !important; }
    }
    @media (max-width: 899px) {
      .desktop-only { display: none !important; }
    }

    .mood-option { display:block; cursor:pointer; }
    .mood-option input { position:absolute; opacity:0; pointer-events:none; }
    .mood-option span { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:82px; border:1px solid var(--line); border-radius:18px; background:#fff; transition:.18s; }
    .mood-option b { font-size:28px; line-height:1; }
    .mood-option small { font-size:10px; font-weight:800; color:#8a9996; }
    .mood-option input:checked + span { border-color:var(--brand); background:var(--brand-soft); box-shadow:0 0 0 3px rgba(15,118,110,.08); transform:translateY(-1px); }
    .help-chat { min-height: 480px; display:flex; flex-direction:column; justify-content:flex-start; }
    .help-bubble { max-width:88%; padding:13px 15px; border-radius:18px; margin-bottom:10px; line-height:1.55; font-size:14px; }
    .help-bubble.bot { background:#f3f7f6; color:#263533; border-bottom-left-radius:7px; align-self:flex-start; }
    .help-bubble.user { background:var(--brand); color:#fff; border-bottom-right-radius:7px; align-self:flex-end; }
    .help-choice { display:flex; align-items:center; justify-content:space-between; width:100%; padding:14px 15px; border:1px solid var(--line); border-radius:16px; background:#fff; font-weight:800; color:var(--ink); text-align:left; transition:.18s; }
    .help-choice:hover { border-color:#c7d8d3; background:#fbfdfd; transform:translateY(-1px); }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="toast-root" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>

  <script type="module">
    /* ============================================================
       ============================================================
       FIREBASE — COLE AS SUAS CREDENCIAIS NESTE BLOCO
       Firebase Console > Configurações do projeto > Seus apps > Web
       ============================================================
       ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB-FUs8qsMy3p8rBVYnQE3q_ZrYAPX2P2A",
  authDomain: "teste-nutrihertio.firebaseapp.com",
  projectId: "teste-nutrihertio",
  storageBucket: "teste-nutrihertio.firebasestorage.app",
  messagingSenderId: "655853343656",
  appId: "1:655853343656:web:e21dd8e10b24444109439d"
};

    /* ============================================================
       PERSONALIZAÇÃO FUNCIONAL
       ============================================================ */
    const SUPPORT_URL = "COLE_AQUI_SEU_LINK_DE_SUPORTE"; // WhatsApp, Google Forms etc.
    const APP_TIMEZONE_NOTE = "Os horários de lembretes usam o horário local do dispositivo.";
    const DEFAULT_CHECKIN_TIME = "19:00";

    const FIREBASE_VERSION = "12.19.0";

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      sendPasswordResetEmail,
      sendEmailVerification,
      updateProfile,
      reload,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
      initializeFirestore,
      getFirestore,
      persistentLocalCache,
      persistentSingleTabManager,
      collection,
      doc,
      getDoc,
      getDocs,
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      query,
      where,
      orderBy,
      serverTimestamp,
      limit,
      waitForPendingWrites,
      getDocFromCache,
      getDocFromServer,
      getDocsFromCache,
      getDocsFromServer
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // ------------------------------------------------------------
    // Estado e utilitários
    // ------------------------------------------------------------
    const appEl = document.getElementById('app');
    const toastRoot = document.getElementById('toast-root');
    const configIsValid = () =>
      FIREBASE_CONFIG.apiKey &&
      !FIREBASE_CONFIG.apiKey.includes('COLE_') &&
      FIREBASE_CONFIG.projectId &&
      !FIREBASE_CONFIG.projectId.includes('SEU_') &&
      FIREBASE_CONFIG.appId &&
      !FIREBASE_CONFIG.appId.includes('SEU_');

    const state = {
      auth: null,
      db: null,
      firebaseReady: false,
      persistenceEnabled: false,
      online: navigator.onLine,
      syncing: false,
      user: null,
      role: null,
      userProfile: null,
      patientProfile: null,
      patients: [],
      selectedPatient: null,
      selectedPatientEvolution: [],
      patientEvolution: [],
      currentView: 'home',
      authMode: 'login',
      patientSearch: '',
      helpTrail: [],
      listeners: [],
      installPrompt: null,
      notificationTimerIds: [],
      lastSyncAt: Number(localStorage.getItem('medcare:lastSyncAt') || 0)
    };

    const uid = () => state.user?.uid || null;
    const isDoctor = () => state.role === 'doctor' || state.role === 'nutritionist';
    const isPatient = () => state.role === 'patient';

    function escapeHTML(value = '') {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function todayKey() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDate(value) {
      if (!value) return '—';
      const raw = typeof value === 'string' ? value : value?.toDate?.() || value;
      const dt = raw instanceof Date ? raw : new Date(raw);
      if (Number.isNaN(dt.getTime())) return '—';
      return dt.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function formatDateTime(value) {
      if (!value) return '—';
      const raw = typeof value === 'string' ? value : value?.toDate?.() || value;
      const dt = raw instanceof Date ? raw : new Date(raw);
      if (Number.isNaN(dt.getTime())) return '—';
      return dt.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function formatNumber(value, digits = 1) {
      if (value === '' || value === null || value === undefined || Number.isNaN(Number(value))) return '—';
      return Number(value).toLocaleString('pt-BR', { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }

    function calculateAge(dateOfBirth) {
      if (!dateOfBirth) return null;
      const birth = new Date(`${dateOfBirth}T00:00:00`);
      if (Number.isNaN(birth.getTime())) return null;
      const now = new Date();
      let age = now.getFullYear() - birth.getFullYear();
      const month = now.getMonth() - birth.getMonth();
      if (month < 0 || (month === 0 && now.getDate() < birth.getDate())) age--;
      return age >= 0 && age <= 130 ? age : null;
    }

    function calculateBMI(weightKg, heightCm) {
      const w = Number(weightKg), h = Number(heightCm) / 100;
      if (!Number.isFinite(w) || !Number.isFinite(h) || h <= 0) return null;
      const bmi = w / (h * h);
      return Number.isFinite(bmi) ? bmi : null;
    }

    function bmiClassification(bmi, age) {
      if (!Number.isFinite(bmi)) return '—';
      if (age !== null && age < 18) return 'Interpretação por idade/sexo';
      if (bmi < 18.5) return 'Abaixo do peso';
      if (bmi < 25) return 'Eutrofia';
      if (bmi < 30) return 'Sobrepeso';
      if (bmi < 35) return 'Obesidade grau I';
      if (bmi < 40) return 'Obesidade grau II';
      return 'Obesidade grau III';
    }

    function latestEvolution() {
      return (state.patientEvolution || [])[0] || null;
    }

    function latestWeight() {
      return latestEvolution()?.weight ?? state.patientProfile?.currentWeight ?? null;
    }

    function weightDelta() {
      const e = state.patientEvolution || [];
      if (e.length < 2) return null;
      const current = Number(e[0]?.weight), previous = Number(e[1]?.weight);
      if (!Number.isFinite(current) || !Number.isFinite(previous)) return null;
      return current - previous;
    }

    function todayEntry() {
      return (state.patientEvolution || []).find(x => x.dateKey === todayKey()) || null;
    }

    function moodLabel(value) {
      return ({1:'Muito mal',2:'Mal',3:'Ok',4:'Bem',5:'Muito bem'})[Number(value)] || '—';
    }

    function adherenceLabel(value) {
      return ({1:'Quase nada',2:'Pouco',3:'Parcial',4:'Quase tudo',5:'Completamente'})[Number(value)] || '—';
    }

    function clearReminderTimers() {
      state.notificationTimerIds.forEach(id => clearTimeout(id));
      state.notificationTimerIds = [];
    }

    function minutesFromHHMM(value) {
      if (!value || !/^\d{2}:\d{2}$/.test(value)) return null;
      const [h,m] = value.split(':').map(Number);
      return Number.isFinite(h) && Number.isFinite(m) ? h*60+m : null;
    }

    function scheduleDailyCheckinPrompt() {
      if (!isPatient() || !state.patientProfile) return;
      const cfg = state.patientProfile.reminders?.dailyCheckin || {};
      const time = cfg.time || DEFAULT_CHECKIN_TIME;
      const target = minutesFromHHMM(time);
      if (!cfg.enabled || target === null || todayEntry()) return;
      const now = new Date();
      const current = now.getHours()*60 + now.getMinutes();
      if (current >= target) {
        showDailyCheckinPrompt();
        return;
      }
      const ms = (target-current)*60*1000 - now.getSeconds()*1000;
      state.notificationTimerIds.push(setTimeout(() => {
        if (!todayEntry()) {
          showDailyCheckinPrompt();
          showBrowserNotification('Seu check-in está esperando por você', 'Preencha seu dia no MedCare.');
        }
      }, Math.max(1000, ms)));
    }

    function showDailyCheckinPrompt() {
      if (!isPatient() || todayEntry()) return;
      const key = `medcare:checkinPrompt:${uid()}:${todayKey()}`;
      if (localStorage.getItem(key)) return;
      localStorage.setItem(key, '1');
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 z-[950] grid place-items-center p-5';
      modal.innerHTML = `
        <div class="absolute inset-0 bg-slate-950/35 backdrop-blur-[2px]" data-close></div>
        <section class="relative card w-full max-w-md p-6 sm:p-7 fade-in">
          <button class="absolute right-4 top-4 p-2 rounded-xl hover:bg-slate-100" data-close>${icon('x',20)}</button>
          <div class="h-12 w-12 rounded-2xl grid place-items-center mb-4" style="background:var(--brand-soft);color:var(--brand)">${icon('heart',24)}</div>
          <div class="text-xs font-black tracking-[.18em] text-slate-400 uppercase">Seu check-in diário</div>
          <h3 class="text-2xl font-black mt-2">Como foi o seu dia?</h3>
          <p class="mt-2 text-sm text-slate-500 leading-6">Leva menos de um minuto. Seu médico usa essas informações para acompanhar sua evolução.</p>
          <div class="grid grid-cols-5 gap-2 mt-5">
            ${['😞','😕','😐','🙂','😄'].map((emoji,i)=>`<div class="rounded-2xl bg-slate-50 py-3 text-center text-2xl">${emoji}<div class="text-[9px] font-bold text-slate-400 mt-1">${i+1}</div></div>`).join('')}
          </div>
          <button class="btn-primary w-full mt-6" data-open-checkin>${icon('arrow',18)} Preencher agora</button>
          <button class="btn-secondary w-full mt-2" data-close>Agora não</button>
        </section>`;
      modal.addEventListener('click', e => {
        if (e.target.closest('[data-open-checkin]')) { modal.remove(); state.currentView = 'home'; renderApp(); setTimeout(() => document.getElementById('daily-checkin-card')?.scrollIntoView({behavior:'smooth', block:'start'}), 80); }
        else if (e.target.closest('[data-close]')) modal.remove();
      });
      document.body.appendChild(modal);
    }

    function showBrowserNotification(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try { new Notification(title, { body, icon: './icons/icon-192.png', tag: 'medcare-reminder' }); } catch {}
    }

    function maybeScheduleBrowserNotification(time, title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const now = new Date();
      const target = new Date();
      const [h,m] = time.split(':').map(Number);
      target.setHours(h,m,0,0);
      if (target <= now) return showBrowserNotification(title, body);
      state.notificationTimerIds.push(setTimeout(() => showBrowserNotification(title, body), target-now));
    }

    async function requestPatientNotifications() {
      if (!('Notification' in window)) return toast('Seu navegador não oferece notificações web.', 'warning');
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        toast('Notificações ativadas neste dispositivo.');
        scheduleDailyCheckinPrompt();
      } else {
        toast('As notificações foram bloqueadas pelo navegador.', 'warning');
      }
      renderPatient();
    }

    function patientPermissionLabel() {
      if (!('Notification' in window)) return 'Não suportadas';
      if (Notification.permission === 'granted') return 'Ativadas';
      if (Notification.permission === 'denied') return 'Bloqueadas';
      return 'Desativadas';
    }

    function toast(message, type = 'success') {
      const bg = type === 'error' ? '#b91c1c' : type === 'warning' ? '#b45309' : '#15803d';
      const el = document.createElement('div');
      el.className = 'toast';
      el.style.background = bg;
      el.innerHTML = `<div class="flex items-center gap-3"><span class="text-lg">${type === 'error' ? '!' : type === 'warning' ? '⚠' : '✓'}</span><span>${escapeHTML(message)}</span></div>`;
      toastRoot.replaceChildren(el);
      window.setTimeout(() => el.remove(), 3400);
    }

    function icon(name, size = 20) {
      const paths = {
        home: '<path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
        people: '<path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M17 8a4 4 0 0 1 0 8M21 21v-2a4 4 0 0 0-3-3.87"/>',
        chart: '<path d="M4 19V5M4 19h17"/><rect x="7" y="11" width="3" height="5" rx="1"/><rect x="12" y="8" width="3" height="8" rx="1"/><rect x="17" y="4" width="3" height="12" rx="1"/>',
        bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
        logout: '<path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 19V5a2 2 0 0 0-2-2h-6"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
        arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
        back: '<path d="M19 12H5M11 18l-6-6 6-6"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        save: '<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.3-6 8-6s7.3 2 8 6"/>',
        droplet: '<path d="M12 3C9 7 6 10 6 14a6 6 0 0 0 12 0c0-4-3-7-6-11z"/>',

    // ------------------------------------------------------------
    // Firebase
    // ------------------------------------------------------------
    async function initFirebase() {
      if (!configIsValid()) {
        renderConfigError();
        return;
      }

      try {
        const firebaseApp = initializeApp(FIREBASE_CONFIG);
        state.auth = getAuth(firebaseApp);
        await setPersistence(state.auth, browserLocalPersistence);

        // Firestore offline-first usando a API moderna de cache persistente.
        // A documentação atual recomenda persistentLocalCache() em vez da antiga
        // enableIndexedDbPersistence(). O modo single-tab reduz conflitos entre abas.
        try {
          state.db = initializeFirestore(firebaseApp, {
            localCache: persistentLocalCache({
              tabManager: persistentSingleTabManager()
            })
          });
          state.persistenceEnabled = true;
        } catch (error) {
          console.warn('Cache persistente indisponível, usando cache em memória:', error);
          try {
            state.db = getFirestore(firebaseApp);
          } catch (fallbackError) {
            throw fallbackError;
          }
          state.persistenceEnabled = false;
        }

        state.firebaseReady = true;
        setupAuthObserver();
      } catch (error) {
        console.error(error);
        renderConfigError('Não foi possível inicializar o Firebase. Revise a configuração no topo do arquivo.');
      }
    }

    function setupAuthObserver() {
      onAuthStateChanged(state.auth, async (user) => {
        cleanupListeners();
        clearReminderTimers();
        state.user = user;
        state.role = null;
        state.userProfile = null;
        state.patientProfile = null;
        state.patients = [];
        state.selectedPatient = null;
        state.selectedPatientEvolution = [];

        if (!user) {
          renderAuth();
          return;
        }

        const passwordProvider = user.providerData?.some(p => p.providerId === 'password');
        if (passwordProvider && !user.emailVerified) {
          renderEmailVerification();
          return;
        }

        loadingScreen('Sincronizando seu perfil…');
        try {
          await ensureUserProfile(user);
          await loadUserContext();
          renderApp();
          scheduleDailyCheckinPrompt();
          scheduleHydrationNotifications();
          syncNow();
        } catch (error) {
          console.error(error);
          renderProfileError(error);
        }
      });
    }

    async function ensureUserProfile(user) {
      const ref = doc(state.db, 'users', user.uid);
      const snap = await readDocSmart(ref);
      if (snap.exists()) {
        if (!snap.data()?.role) {
          await setDoc(ref, { email: user.email || '', displayName: user.displayName || '', role: 'patient', updatedAt: serverTimestamp() }, { merge: true });
        }
        const patientRef = doc(state.db, 'patients', user.uid);
        const ps = await readDocSmart(patientRef);
        if (!ps.exists() && (snap.data()?.role || 'patient') === 'patient') {
          await createInitialPatient(user);
        }
        return;
      }
      await setDoc(ref, {
        email: user.email || '',
        displayName: user.displayName || user.email?.split('@')[0] || 'Paciente',
        role: 'patient',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      await createInitialPatient(user);
    }

    async function createInitialPatient(user) {
      await setDoc(doc(state.db, 'patients', user.uid), {
        name: user.displayName || user.email?.split('@')[0] || 'Paciente',
        email: user.email || '',
        dateOfBirth: null,
        sex: '',
        heightCm: null,
        targetWeight: null,
        currentWeight: null,
        waistCm: null,
        hipCm: null,
        bodyFatPct: null,
        muscleMassKg: null,
        activityLevel: 'Moderado',
        dietaryPattern: '',
        allergies: '',
        intolerances: '',
        healthConditions: '',
        medicationsSupplements: '',
        previousDiets: '',
        restrictions: '',
        objective: 'Emagrecimento',
        doctorId: null,
        alerts: [],
        reminders: { dailyCheckin: { enabled: true, time: DEFAULT_CHECKIN_TIME, askWeight: true } },
        recommendations: 'Siga as orientações definidas pelo seu médico.',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge: false });
    }

    async function loadUserContext() {
      const userRef = doc(state.db, 'users', uid());
      const snap = await readDocSmart(userRef);
      if (!snap.exists()) {
        throw new Error('Perfil do usuário não encontrado no Firestore.');
      }
      state.userProfile = snap.data();
      state.role = state.userProfile.role;

      if (!['patient', 'doctor', 'nutritionist'].includes(state.role)) {
        throw new Error('Perfil sem função válida.');
      }

      if (isPatient()) {
        await refreshPatientData();
      } else {
        await refreshDoctorPatients();
      }
    }

    async function readDocSmart(ref) {
      if (!navigator.onLine) return getDocFromCache(ref);
      try {
        return await getDocFromServer(ref);
      } catch (serverError) {
        console.warn('Leitura do servidor falhou; usando cache local.', serverError);
        return getDocFromCache(ref);
      }
    }

    async function readQuerySmart(q) {
      if (!navigator.onLine) return getDocsFromCache(q);
      try {
        return await getDocsFromServer(q);
      } catch (serverError) {
        console.warn('Consulta do servidor falhou; usando cache local.', serverError);
        return getDocsFromCache(q);
      }
    }

    async function refreshPatientData() {
      if (!state.db || !uid()) return;
      try {
        const patientRef = doc(state.db, 'patients', uid());
        const evolutionRef = collection(state.db, 'patients', uid(), 'evolution');
        const evolutionQuery = query(evolutionRef, orderBy('dateKey', 'desc'), limit(30));
        const [patientSnap, evolutionSnap] = await Promise.all([
          readDocSmart(patientRef),
          readQuerySmart(evolutionQuery)
        ]);
        state.patientProfile = patientSnap.exists() ? patientSnap.data() : null;
        state.patientEvolution = evolutionSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      } catch (error) {
        console.error('refreshPatientData:', error);
        if (error?.code === 'failed-precondition' || /INTERNAL ASSERTION FAILED/i.test(error?.message || '')) {
          throw error;
        }
        state.patientEvolution = [];
        renderApp();
      }
    }

    async function refreshDoctorPatients() {
      if (!state.db || !uid()) return;
      const patientsRef = collection(state.db, 'patients');
      const assignedQ = query(patientsRef, where('doctorId', '==', uid()));
      const unassignedQ = query(patientsRef, where('doctorId', '==', null));
      try {
        const [assignedSnap, unassignedSnap] = await Promise.all([
          readQuerySmart(assignedQ),
          readQuerySmart(unassignedQ)
        ]);
        state._assignedPatients = assignedSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state._unassignedPatients = unassignedSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        mergeDoctorPatients();
      } catch (error) {
        console.error('refreshDoctorPatients:', error);
        throw error;
      }
    }

    function mergeDoctorPatients() {
      const map = new Map();
      [...(state._assignedPatients || []), ...(state._unassignedPatients || [])]
        .forEach(p => map.set(p.id, p));
      state.patients = [...map.values()].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'pt-BR'));
      renderApp();
    }

    async function refreshSelectedPatientEvolution(patientId) {
      if (!patientId || !state.db) return;
      try {
        const evolutionRef = collection(state.db, 'patients', patientId, 'evolution');
        const q = query(evolutionRef, orderBy('dateKey', 'desc'), limit(120));
        const snap = await readQuerySmart(q);
        state.selectedPatientEvolution = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderDoctor();
      } catch (error) {
        console.error('refreshSelectedPatientEvolution:', error);
        state.selectedPatientEvolution = [];
        renderDoctor();
      }
    }

    function cleanupSelectedEvolutionListener() {
      state.selectedEvolutionUnsub = null;
    }

    function cleanupListeners() {
      state.listeners.forEach(fn => { try { fn(); } catch {} });
      state.listeners = [];
      cleanupSelectedEvolutionListener();
    }

    // ------------------------------------------------------------
    // Sincronização
    // ------------------------------------------------------------
    async function syncNow() {
      if (!state.firebaseReady || !state.db || !state.user || !navigator.onLine) return;
      if (state.syncing) return;
      state.syncing = true;
      updateSyncIndicator();
      try {
        await waitForPendingWrites(state.db);
        if (isPatient()) await refreshPatientData();
        if (isDoctor()) await refreshDoctorPatients();
        if (state.selectedPatient?.id) await refreshSelectedPatientEvolution(state.selectedPatient.id);
        state.lastSyncAt = Date.now();
        localStorage.setItem('medcare:lastSyncAt', String(state.lastSyncAt));
      } catch (error) {
        console.debug('Sync:', error?.code || error?.message || error);
      } finally {
        state.syncing = false;
        updateSyncIndicator();
      }
    }

    setInterval(() => {
      // Melhor esforço: se o app permanecer aberto, tenta sincronizar pelo menos 1x/dia.
      if (Date.now() - state.lastSyncAt >= 24 * 60 * 60 * 1000) syncNow();
    }, 60 * 60 * 1000);

    window.addEventListener('online', () => {
      state.online = true;
      updateSyncIndicator();
      syncNow();
      clearReminderTimers();
      scheduleDailyCheckinPrompt();
      scheduleHydrationNotifications();
    });
    window.addEventListener('offline', () => {
      state.online = false;
      updateSyncIndicator();
    });

    function updateSyncIndicator() {
      const el = document.getElementById('sync-indicator');
      if (!el) return;
      if (!navigator.onLine) {
        el.innerHTML = `<span class="inline-flex items-center gap-2 text-amber-700">● Offline</span>`;
        return;
      }
      if (state.syncing) {
        el.innerHTML = `<span class="inline-flex items-center gap-2 text-slate-500"><span class="animate-pulse">●</span> Sincronizando…</span>`;
        return;
      }
      el.innerHTML = `<span class="inline-flex items-center gap-2 text-emerald-700">● Sincronizado</span>`;
    }

    function showIOSInstallHelp() {
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

      if (!isIOS || isStandalone) {
        toast('Use o menu do navegador para instalar este site.', 'warning');

          localStorage.clear();
          sessionStorage.clear();

            if (db.name && /firestore|firebase/i.test(db.name)) indexedDB.deleteDatabase(db.name);
          }
        } catch (e) { console.warn('Limpeza de cache:', e); }
        location.reload();
      });
      document.getElementById('logout-profile')?.addEventListener('click', () => signOut(state.auth));

                  <button class="btn-primary w-full" type="submit" id="auth-submit">${login ? icon('arrow',18) + ' Entrar' : icon('plus',18) + ' Criar conta'}</button>

        </main>`;

      document.querySelectorAll('[data-auth-mode]').forEach(btn => btn.addEventListener('click', () => { state.authMode = btn.dataset.authMode; renderAuth(); }));
      document.getElementById('auth-form')?.addEventListener('submit', handleAuthSubmit);
      document.getElementById('forgot-password')?.addEventListener('click', handleForgotPassword);
      document.getElementById('google-login')?.addEventListener('click', handleGoogleLogin);
    }

    async function handleGoogleLogin() {
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const mobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
        if (mobile) await signInWithRedirect(state.auth, provider);
        else await signInWithPopup(state.auth, provider);
      } catch (error) {
        toast(firebaseErrorMessage(error), 'error');
      }
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      if (!state.auth) return;
      const form = new FormData(event.currentTarget);
      const email = String(form.get('email') || '').trim().toLowerCase();
      const password = String(form.get('password') || '');
      const submit = document.getElementById('auth-submit');
      submit.disabled = true; submit.textContent = 'Aguarde…';
      try {
        if (state.authMode === 'login') {
          await signInWithEmailAndPassword(state.auth, email, password);
          toast('Login realizado.');
        } else {
          const name = String(form.get('name') || '').trim();
          const password2 = String(form.get('password2') || '');
          if (!name) throw new Error('Informe seu nome.');
          if (password !== password2) throw new Error('As senhas não coincidem.');
          const cred = await createUserWithEmailAndPassword(state.auth, email, password);
          await updateProfile(cred.user, { displayName: name });
          await createInitialPatient({ ...cred.user, displayName: name, email });
          await setDoc(doc(state.db, 'users', cred.user.uid), { email, displayName: name, role: 'patient', createdAt: serverTimestamp(), updatedAt: serverTimestamp() }, { merge: true });
          await sendEmailVerification(cred.user);
          renderEmailVerification();
          toast('Conta criada. Confirme o e-mail para continuar.');
        }
      } catch (error) {
        toast(firebaseErrorMessage(error), 'error');
        submit.disabled = false; submit.textContent = state.authMode === 'login' ? 'Entrar' : 'Criar conta';
      }
    }

    async function handleForgotPassword() {
      const email = window.prompt('Informe o e-mail da conta:');
      if (!email) return;
      try {
        await sendPasswordResetEmail(state.auth, email.trim().toLowerCase());
        toast('Enviamos o link de recuperação para o e-mail.');
      } catch (error) {
        toast(firebaseErrorMessage(error), 'error');
      }
    }

    function firebaseErrorMessage(error) {
      const map = {
        'auth/invalid-credential': 'E-mail ou senha incorretos.',
        'auth/invalid-email': 'O e-mail informado é inválido.',
        'auth/email-already-in-use': 'Este e-mail já está cadastrado.',
        'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
        'auth/network-request-failed': 'Sem conexão. Tente novamente quando estiver online.',
        'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos.',
        'auth/popup-blocked': 'O navegador bloqueou a janela do Google. Tente novamente ou permita pop-ups.',
        'auth/popup-closed-by-user': 'A janela do Google foi fechada antes do login terminar.',
        'auth/account-exists-with-different-credential': 'Já existe uma conta com este e-mail usando outro método de login. Entre pelo método original.'
      };
      return map[error?.code] || error?.message || 'Ocorreu um erro. Tente novamente.';
    }

    function alertCard(alert) {
      const times = waterTimes(alert.start || '08:00', alert.end || '22:00', Number(alert.intervalHours || 2));
      return `<div class="mt-2 flex items-start gap-3"><div class="mt-0.5 text-cyan-600">${icon('droplet',18)}</div><div><div class="font-bold">Água a cada ${escapeHTML(alert.intervalHours || 2)} h</div><div class="text-xs text-slate-500 mt-1">${escapeHTML(alert.start || '08:00')}–${escapeHTML(alert.end || '22:00')}</div><div class="text-xs text-slate-500 mt-1">${times.slice(0,6).join(' · ')}${times.length > 6 ? ' · …' : ''}</div></div></div>`;
    }

    function waterTimes(start, end, hours) {
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      const startMin = sh * 60 + sm;
      const endMin = eh * 60 + em;
      if (!Number.isFinite(startMin) || !Number.isFinite(endMin) || !Number.isFinite(hours) || hours <= 0 || endMin < startMin) return [];
      const out = [];
      for (let m = startMin; m <= endMin && out.length < 20; m += hours * 60) {
        out.push(`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`);
      }
      return out;
    }

    function bindDoctorEvents() {
      document.querySelectorAll('[data-action="back-patients"]').forEach(btn => btn.addEventListener('click', () => { state.selectedPatient = null; state.selectedPatientEvolution = []; renderDoctor(); }));
      document.querySelectorAll('[data-action="clear-selected"]').forEach(btn => btn.addEventListener('click', () => { state.selectedPatient = null; state.selectedPatientEvolution = []; renderDoctor(); }));
      document.querySelectorAll('[data-patient-id]').forEach(btn => btn.addEventListener('click', () => selectPatient(btn.dataset.patientId)));
      document.getElementById('patient-search')?.addEventListener('input', (e) => { state.patientSearch = e.target.value; renderDoctor(); focusPatientSearch(); });
      document.getElementById('patient-profile-form')?.addEventListener('submit', savePatientProfile);
    }

    function focusPatientSearch() {
      const el = document.getElementById('patient-search');
      if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
    }

    function selectPatient(patientId) {
      const p = state.patients.find(x => x.id === patientId);
      if (!p) return;
      state.selectedPatient = p;
      state.selectedPatientEvolution = [];
      state.currentView = 'patients';
      refreshSelectedPatientEvolution(patientId);
      renderDoctor();
    }

    async function savePatientProfile(event) {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const p = state.selectedPatient;
      if (!p) return;
      const alertEnabled = document.getElementById('alert-enabled')?.checked;
      const checkinEnabled = document.getElementById('checkin-enabled')?.checked;
      const waterInterval = Number(form.get('waterInterval') || 2);
      const waterStart = String(form.get('waterStart') || '08:00');
      const waterEnd = String(form.get('waterEnd') || '22:00');
      const name = String(form.get('name') || '').trim();
      if (!name) return toast('Informe o nome do paciente.', 'error');
      if (alertEnabled && waterEnd < waterStart) return toast('O horário final da hidratação precisa ser igual ou depois do inicial.', 'error');
      const dateOfBirth = String(form.get('dateOfBirth') || '') || null;
      if (dateOfBirth && calculateAge(dateOfBirth) === null) return toast('Confira a data de nascimento.', 'error');
      const payload = {
        name, email: p.email || '', dateOfBirth, sex: String(form.get('sex') || ''), age: dateOfBirth ? calculateAge(dateOfBirth) : null,
        objective: String(form.get('objective') || 'Emagrecimento'), activityLevel: String(form.get('activityLevel') || 'Moderado'),
        heightCm: form.get('heightCm') ? Number(form.get('heightCm')) : null, targetWeight: form.get('targetWeight') ? Number(form.get('targetWeight')) : null,
        currentWeight: form.get('currentWeight') ? Number(form.get('currentWeight')) : (latestWeight() || null), waistCm: form.get('waistCm') ? Number(form.get('waistCm')) : null,
        hipCm: form.get('hipCm') ? Number(form.get('hipCm')) : null, bodyFatPct: form.get('bodyFatPct') ? Number(form.get('bodyFatPct')) : null,
        muscleMassKg: form.get('muscleMassKg') ? Number(form.get('muscleMassKg')) : null, hydrationGoalMl: form.get('hydrationGoalMl2') ? Number(form.get('hydrationGoalMl2')) : (form.get('hydrationGoalMl') ? Number(form.get('hydrationGoalMl')) : null),
        dietaryPattern: String(form.get('dietaryPattern') || ''), restrictions: String(form.get('restrictions') || '').trim(),
        allergies: String(form.get('allergies') || '').trim(), intolerances: String(form.get('intolerances') || '').trim(),
        healthConditions: String(form.get('healthConditions') || '').trim(), medicationsSupplements: String(form.get('medicationsSupplements') || '').trim(), previousDiets: String(form.get('previousDiets') || '').trim(),
        recommendations: String(form.get('recommendations') || '').trim(), doctorId: uid(),
        reminders: { dailyCheckin: { enabled: checkinEnabled, time: String(form.get('checkinTime') || DEFAULT_CHECKIN_TIME), askWeight: String(form.get('checkinAskWeight') || 'true') === 'true' } },
        alerts: alertEnabled ? [{ type:'water', label:'Hidratação', intervalHours:waterInterval, start:waterStart, end:waterEnd, enabled:true }] : [],
        updatedAt: serverTimestamp()
      };
      try {
        await updateDoc(doc(state.db, 'patients', p.id), payload);
        state.selectedPatient = { ...p, ...payload, updatedAt: new Date() };
        toast(navigator.onLine ? 'Acompanhamento salvo e sincronizado.' : 'Acompanhamento salvo no dispositivo.');
        await refreshDoctorPatients();
        if (state.selectedPatient?.id) await refreshSelectedPatientEvolution(state.selectedPatient.id);
        renderDoctor();
      } catch (error) { console.error(error); toast(firebaseErrorMessage(error), 'error'); }
    }

    // ------------------------------------------------------------
    // Eventos — paciente
    // ------------------------------------------------------------
    function bindPatientEvents() {
      document.getElementById('evolution-form')?.addEventListener('submit', saveEvolution);
    }

    async function saveEvolution(event) {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const weightRaw = String(form.get('weight') || '').trim();
      const currentWeight = weightRaw ? Number(weightRaw) : Number(latestWeight());
      const askWeight = state.patientProfile?.reminders?.dailyCheckin?.askWeight !== false;
      if (askWeight && (!Number.isFinite(currentWeight) || currentWeight < 20 || currentWeight > 400)) return toast('Informe um peso válido.', 'error');
      const mood = Number(form.get('mood'));
      if (!Number.isFinite(mood) || mood < 1 || mood > 5) return toast('Escolha como você se sentiu hoje.', 'error');
      const today = todayEntry();
      const payload = {
        patientId: uid(), dateKey: todayKey(), weight: Number.isFinite(currentWeight) ? currentWeight : null,
        mood, energy: form.get('energy') ? Number(form.get('energy')) : null, hunger: form.get('hunger') ? Number(form.get('hunger')) : null,
        adherence: form.get('adherence') ? Number(form.get('adherence')) : null, waterLiters: form.get('waterLiters') ? Number(form.get('waterLiters')) : null,
        exerciseMinutes: form.get('exerciseMinutes') ? Number(form.get('exerciseMinutes')) : null, sleepHours: form.get('sleepHours') ? Number(form.get('sleepHours')) : null,
        digestion: String(form.get('digestion') || ''), note: String(form.get('note') || '').trim(), createdBy: uid(), updatedAt: serverTimestamp(), createdAt: today?.createdAt || serverTimestamp()
      };
      try {
        await setDoc(doc(state.db, 'patients', uid(), 'evolution', todayKey()), payload, { merge: true });
        toast(navigator.onLine ? 'Seu dia foi salvo e sincronizado.' : 'Seu dia foi salvo no dispositivo e será sincronizado quando houver internet.');
        await refreshPatientData();
        scheduleDailyCheckinPrompt();
        syncNow();
      } catch (error) { console.error(error); toast(firebaseErrorMessage(error), 'error'); }
    }

    function scheduleHydrationNotifications() {
      if (!isPatient() || !state.patientProfile || !('Notification' in window) || Notification.permission !== 'granted') return;
      const alert = (state.patientProfile.alerts || []).find(a => a.enabled !== false && a.type === 'water');
      if (!alert) return;
      const times = waterTimes(alert.start || '08:00', alert.end || '22:00', Number(alert.intervalHours || 2));
      const now = new Date();
      for (const time of times) {
        const [h,m] = time.split(':').map(Number); const target = new Date(); target.setHours(h,m,0,0);
        if (target <= now) continue;
        state.notificationTimerIds.push(setTimeout(() => showBrowserNotification('Hora de beber água', `Lembrete definido pelo seu médico: ${time}.`), target-now));
      }
    }

    // ------------------------------------------------------------
    // Ajuda — fluxo guiado em estilo chat
    // ------------------------------------------------------------
    const HELP_TREE = {
      root: {
        text: 'Com o que você precisa de ajuda?',
        options: [
          ['account','Conta e acesso'], ['notifications','Notificações e lembretes'], ['privacy','Dados e privacidade'],
          ['usage','Como usar o app'], ['offline','Offline e sincronização'], ['install','Instalação / PWA'], ['bugs','Bug ou problema']
        ]
      },
      account: { text: 'Qual parte da conta está te atrapalhando?', options:[['login','Não consigo entrar'],['verify','Confirmar e-mail'],['google','Login com Google'],['doctor','Minha conta é de médico'],['back','Voltar']] },
      notifications: { text: 'Sobre os lembretes, qual assunto?', options:[['daily','Check-in diário'],['water','Hidratação'],['permission','Permitir notificações'],['back','Voltar']] },
      privacy: { text: 'O que você quer entender sobre seus dados?', options:[['access','O que o médico vê'],['offlinePrivacy','O que fica salvo no aparelho'],['back','Voltar']] },
      usage: { text: 'O que você quer aprender?', options:[['patientFlow','Como preencher meu dia'],['doctorFlow','Como acompanhar um paciente'],['bmi','Como funciona o IMC'],['back','Voltar']] },
      offline: { text: 'Sobre o modo offline:', options:[['offlineHow','Como funciona'],['sync','Quando sincroniza'],['back','Voltar']] },
      install: { text: 'Onde você quer instalar?', options:[['android','Android'],['iphone','iPhone'],['desktop','Computador'],['back','Voltar']] },
      bugs: { text: 'Para reportar um bug ou pedir suporte, use o canal configurado pela clínica.', options:[['openSupport','Abrir suporte'],['back','Voltar']] }
    };
    const HELP_ANSWERS = {
      login:'Confira e-mail e senha. Se esqueceu a senha, use “Esqueci minha senha”. Se estiver sem internet, o primeiro login precisa ter sido feito antes para o acesso local continuar disponível.',
      verify:'Contas com e-mail e senha precisam confirmar o endereço. Procure o e-mail do Firebase, clique no link e volte ao app; há um botão para reenviar a mensagem na tela de confirmação.',
      google:'O login com Google usa o provedor oficial do Firebase. No celular, o app usa o fluxo de redirecionamento; no computador, pode abrir uma janela de autenticação.',
      doctor:'A função de médico é definida pelo administrador no documento users/{uid} do Firestore. O cadastro público nunca concede essa função sozinho.',
      daily:'O check-in diário reúne humor, energia, fome, adesão ao plano, água, atividade física, sono, digestão e observações. O médico controla se ele fica ativo, o horário e se o peso será solicitado.',
      water:'O médico pode definir uma janela e uma cadência de hidratação. O app mostra os horários e pode usar notificações do navegador quando autorizadas.',
      permission:'No painel do paciente, toque em “Ativar notificações” e permita no navegador. A permissão é dada pelo próprio dispositivo.',
      access:'O médico vinculado tem acesso ao perfil médico e aos registros de evolução/check-ins necessários para o acompanhamento. A conta do paciente não pode ver os dados de outros pacientes.',
      offlinePrivacy:'O Firestore mantém um cache local para que o aplicativo continue útil offline. Em dispositivos compartilhados, o usuário deve sair da conta e o dispositivo deve ser confiável.',
      patientFlow:'Abra “Início”, preencha o check-in do dia e salve. Na aba “Evolução”, você acompanha o histórico.',
      doctorFlow:'Abra “Pacientes”, pesquise o paciente, abra o acompanhamento e atualize avaliação, objetivo, orientações e lembretes.',
      bmi:'O IMC é calculado por peso ÷ altura². Para adultos, o app exibe a classificação de referência; em menores de 18 anos, ele não substitui a interpretação por idade e sexo.',
      offlineHow:'Alterações feitas sem internet ficam no cache do Firestore e aguardam sincronização. O sistema tenta atualizar quando a conexão volta.',
      sync:'Ao abrir o app com internet e quando a conexão retorna, o MedCare tenta sincronizar as alterações pendentes.',
      android:'No Android, use o Chrome e escolha “Instalar app” ou “Adicionar à tela de início” quando aparecer.',
      iphone:'No iPhone, abra no Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.',
      desktop:'No Chrome/Edge, use o ícone de instalação na barra de endereço quando o PWA estiver elegível.',
      openSupport:'__SUPPORT__'
    };

    function helpChoiceLabel(key) {
      for (const node of Object.values(HELP_TREE)) {
        const found = (node.options || []).find(([k]) => k === key);
        if (found) return found[1];
      }
      return key;
    }

    function renderHelp() {
      const current = state.helpTrail[state.helpTrail.length-1] || 'root';
      const node = HELP_TREE[current];
      const answerRaw = node ? null : HELP_ANSWERS[current];
      const answer = answerRaw === '__SUPPORT__' ? 'Abra o canal de suporte configurado pela clínica para falar sobre bugs, erros ou dúvidas que não foram resolvidas aqui.' : answerRaw;
      const historyKeys = state.helpTrail.slice(0,-1);
      const bubbles = historyKeys.map(key => `<div class="help-bubble user">${escapeHTML(helpChoiceLabel(key))}</div>`).join('');
      document.getElementById('main-content').innerHTML = `
        <section class="fade-in max-w-3xl mx-auto">
          <div class="mb-6"><div class="text-xs font-black tracking-[.18em] text-slate-500 uppercase">Central de ajuda</div><h1 class="text-3xl sm:text-4xl font-black mt-2">Como podemos ajudar?</h1><p class="text-slate-500 mt-2">Escolha uma opção. O atendimento aqui é guiado, sem respostas livres.</p></div>
          <section class="card p-4 sm:p-6"><div class="help-chat">
            <div class="help-bubble bot">Olá! Eu vou te conduzir até a informação certa.</div>
            ${bubbles}
            ${answer ? `<div class="help-bubble bot whitespace-pre-line">${escapeHTML(answer)}</div>` : `<div class="help-bubble bot">${escapeHTML(node?.text || HELP_TREE.root.text)}</div>`}
            ${answer ? `<button class="btn-secondary w-full mt-3" data-help-root>${icon('back',17)} Voltar ao começo</button>${answerRaw==='__SUPPORT__' ? (SUPPORT_URL.startsWith('http') ? `<a class="btn-primary w-full mt-2" href="${escapeHTML(SUPPORT_URL)}" target="_blank" rel="noopener">${icon('arrow',18)} Abrir suporte</a>` : `<div class="mt-2 rounded-2xl bg-amber-50 border border-amber-100 p-3 text-xs text-amber-800">O link de suporte ainda não foi configurado pelo administrador.</div>`) : ''}` : `<div class="grid sm:grid-cols-2 gap-2 mt-4">${(node?.options || []).map(([key,label])=>key==='back'?`<button class="btn-secondary" data-help-back>${icon('back',17)} ${escapeHTML(label)}</button>`:`<button class="help-choice" data-help="${escapeHTML(key)}">${escapeHTML(label)}<span>›</span></button>`).join('')}</div>`}
          </div></section>
        </section>`;
      bindHelpEvents();
    }

    function bindHelpEvents() {
      document.querySelectorAll('[data-help]').forEach(btn => btn.addEventListener('click', () => {
        const key = btn.dataset.help;
        if (HELP_ANSWERS[key]) state.helpTrail.push(key);
        else state.helpTrail.push(key);
        renderHelp();
      }));
      document.querySelector('[data-help-back]')?.addEventListener('click', () => { state.helpTrail = state.helpTrail.slice(0,-1); renderHelp(); });
      document.querySelector('[data-help-root]')?.addEventListener('click', () => { state.helpTrail = []; renderHelp(); });
    }

    // ------------------------------------------------------------
    // Navegação por delegação simples para botões gerados novamente
    // ------------------------------------------------------------
    document.addEventListener('click', (event) => {
      const action = event.target.closest('[data-action]');
      if (!action) return;
      const value = action.dataset.action;
      if (value === 'go-patients') { state.currentView = 'patients'; state.selectedPatient = null; renderApp(); }
      if (value === 'enable-notifications') requestPatientNotifications();
    });

    // Inicialização
    loadingScreen('Inicializando…');
    initFirebase();
  </script>
</body>
</html>
